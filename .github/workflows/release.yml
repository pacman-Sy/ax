name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach assets to"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: ax-linux-x86_64
            rustflags: -C target-feature=+crt-static
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset: ax-linux-aarch64
            rustflags: -C target-feature=+crt-static -C linker=rust-lld -C link-self-contained=yes
          - os: macos-13
            target: x86_64-apple-darwin
            asset: ax-macos-x86_64
            rustflags: ""
          - os: macos-14
            target: aarch64-apple-darwin
            asset: ax-macos-aarch64
            rustflags: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ax-windows-x86_64.exe
            rustflags: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Stage asset and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ax${{ endsWith(matrix.asset, '.exe') && '.exe' || '' }}" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.sha256" --clobber
